name: build valkey

# Asked for, never automatic — the same rule every other workflow here keeps, for the same reason:
# upstream releases on its own schedule and a human decides which version is wanted.
#
# **`build-redis.yml` with Valkey's names**, because the build is Redis's: the same POSIX source
# compiled on four Unix cells and, against Cygwin, on windows/x86_64, with windows/aarch64 exiting 75
# because there is no Cygwin for ARM64. Whether each Valkey line compiles and starts under Cygwin is
# not assumed from Redis — Valkey 8.0 rewrote I/O threading and 8.1 the main hash table — so every
# line runs the Windows leg and its result is what the recipe records.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Valkey line (9, 9.1), exact version (9.1.2), or 'latest'. 7.2 and up."
        required: true
        type: string
      release:
        description: 'Publish as a GitHub release. Off means build and keep the artifacts for inspection only.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  pack:
    # Every leg runs on the operating system and architecture it packs for — a compiler's requirement
    # as well as the smoke test's. Linux on 22.04 for the glibc floor, as in `build-redis.yml`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     os: linux,   arch: x86_64 }
          - { runner: ubuntu-22.04-arm, os: linux,   arch: aarch64 }
          - { runner: macos-14,         os: macos,   arch: aarch64 }
          - { runner: macos-15-intel,   os: macos,   arch: x86_64 }
          - { runner: windows-2022,     os: windows, arch: x86_64 }
          - { runner: windows-11-arm,   os: windows, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The POSIX runtime the source is compiled against, and every reason for the package list and
      # for `add-to-path: false` is written beside the same step in `build-redis.yml`.
      - uses: cygwin/cygwin-install-action@master
        id: cygwin
        if: matrix.os == 'windows' && matrix.arch == 'x86_64'
        with:
          packages: make gcc-core gcc-g++ pkg-config libiconv gettext
          add-to-path: false
      - name: build and pack
        id: pack
        # 75 is "there is no build for this target": windows/aarch64 always, and a Windows line the
        # recipe has measured and recorded as not starting under Cygwin. Every other non-zero code is
        # real and is passed on.
        shell: bash
        env:
          CYGWIN_ROOT: ${{ steps.cygwin.outputs.root }}
        run: |
          code=0
          python -u tools/valkey.py --version "${{ inputs.version }}" --out dist || code=$?
          if [ "$code" -eq 75 ]; then
            echo "::notice::no Valkey ${{ inputs.version }} for ${{ matrix.os }}/${{ matrix.arch }}; see the log for why"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
        timeout-minutes: 45
      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.skipped != 'true'
        with:
          name: valkey-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    # One release per exact version, holding every artifact of it — the version read back out of
    # each manifest rather than taken from the input.
    needs: pack
    if: ${{ inputs.release && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: incoming, merge-multiple: true }
      - name: publish one release per version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versions=$(jq -r '.version' incoming/*.json | sort -u)
          for version in $versions; do
            tag="valkey-$version"
            assets=()
            for manifest in incoming/*.json; do
              [ "$(jq -r '.version' "$manifest")" = "$version" ] || continue
              assets+=("${manifest%.json}" "$manifest")
            done
            echo "== $tag: ${#assets[@]} artifact(s)"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --title "Valkey $version" \
                --notes "Relocatable Valkey $version for MixEngine, compiled from upstream's own source release against the SHA-256 published in valkey-io/valkey-hashes, under BSD-3-Clause. macOS and Linux on both architectures, and Windows on x86_64 where the line starts under Cygwin — the source is unmodified and cygwin1.dll travels beside the binaries under LGPLv3. Core Valkey with its static Lua engine; no TLS, no RDMA, and no redis-* compatibility names. Every artifact was run as a cache from a directory it had been moved to before being published — started against a rendered valkey.conf, answering ping, its valkey_version checked, a key written and read back, a Lua script run, and the server shut down — see mixengine-artifact.json inside each one for what was proven."
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          done
