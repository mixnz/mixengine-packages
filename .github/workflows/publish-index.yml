name: publish index

# The index is extended from what the releases actually contain, never from what a build job
# thought it produced. A release that failed to upload is therefore absent from the index rather
# than present and broken — which is the failure mode worth designing for, because the index is
# signed and a client has no way to doubt it afterwards. What the published index already
# describes is compared by digest rather than downloaded again; see tools/gather.py.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the signed index. Off means generate and verify only.'
        required: false
        default: false
        type: boolean
      recheck:
        description: "A kind, or 'all': look again at versions the index already describes. Costs time, not disk."
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  INDEX_TAG: index
  BASE_URL: https://github.com/${{ github.repository }}/releases/download
  PUBLISHED: https://github.com/${{ github.repository }}/releases/download/index/index.json
  PUBLISHED_ROOT: https://github.com/${{ github.repository }}/releases/download/index/index-v2.json

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema

      # The published index already describes nearly everything, and GitHub states a sha256 for
      # every asset, so the listing alone says which versions are new, which gained a cell and
      # which had their bytes replaced. Only those are downloaded, one version at a time, compared
      # cell against cell and deleted before the next: the disk this needs is the largest single
      # version, not the archive. `recheck` is how a change to the comparison itself, or a manifest
      # corrected by hand, reaches versions that are already described.
      - name: look at what the published index does not already describe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECHECK: ${{ inputs.recheck }}
        run: |
          python -u tools/gather.py \
            --previous "$PUBLISHED" \
            --base-url "$BASE_URL" \
            --recheck "$RECHECK" \
            --out work/found.json

      - name: generate
        run: |
          python tools/mkindex.py \
            --found work/found.json \
            --previous "$PUBLISHED" \
            --base-url "$BASE_URL" \
            --out dist/index.json

      # One command, and no retry without `--previous`: a document that is not published yet is
      # told apart from one that could not be read inside verify.py, so a lost version can no
      # longer pass by failing first.
      - name: verify before signing
        run: |
          python tools/verify.py dist/index.json \
            --previous "$PUBLISHED" \
            --catalogue dist \
            --previous-root "$PUBLISHED_ROOT"

      - name: sign
        if: inputs.publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set. Generate a key with 'minisign -G',"
            echo "::error::commit minisign.pub, and put the private key in this repository's secrets."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          for document in dist/index.json dist/index-v2.json; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -m "$document" -s minisign.key
          done
          shred -u minisign.key
          # Prove the signatures against the key in the tree, which is the same key compiled into
          # MixEngine. Signing with a key nobody can check is worth nothing.
          for document in dist/index.json dist/index-v2.json; do
            minisign -V -m "$document" -p minisign.pub
          done

      - name: publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$INDEX_TAG" >/dev/null 2>&1 || \
            gh release create "$INDEX_TAG" --title "Package index" \
              --notes "The signed index MixEngine reads. Always the newest one; the tag is moved rather than added to, so the URL never changes."
          gh release upload "$INDEX_TAG" dist/index.json dist/index.json.minisig --clobber
          # Schema 2, in the one order that never shows a client a wrong answer: the kind files
          # that changed, then the root, then its signature last. A client asks for the signature
          # first, so until that last upload it sees nothing new; GitHub cannot replace several
          # assets at once, and what a client can meet in between is a refusal it retries.
          python tools/catalogue.py --changed dist --against "$PUBLISHED_ROOT" > changed.txt
          while read -r name; do
            if [ -n "$name" ]; then
              gh release upload "$INDEX_TAG" "dist/$name" --clobber
            fi
          done < changed.txt
          gh release upload "$INDEX_TAG" dist/index-v2.json --clobber
          gh release upload "$INDEX_TAG" dist/index-v2.json.minisig --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: dist/index*.json*
